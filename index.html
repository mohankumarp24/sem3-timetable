<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sem III">
<meta name="theme-color" id="themeColorMeta" content="#12161C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Sem III Timetable — PSGIM</title>
<style>
  /* ============ TOKENS ============ */
  :root{
    --ink:#0B0D12; --panel:#12161C; --panel-soft:#171C23; --panel-raised:#1F252E;
    --line:rgba(255,255,255,0.07); --line-strong:rgba(255,255,255,0.13);
    --text:#EEF0F3; --text-dim:#9AA1AD; --text-faint:#5E6572;
    --amber:#FFB020; --amber-ink:#1A1306; --amber-soft:rgba(255,176,32,0.14); --live:#5FD68A;
    --c-iapm1:#3FBFA5; --c-fd1:#E8735C; --c-pm1:#5B8DEF; --c-mfs1:#D65DB1;
    --c-sma:#8B6BD1; --c-brsa:#6FBF5B; --c-proj:#8B93A1; --c-club:#4FB8D6;
    --radius:16px; --safe-b:env(safe-area-inset-bottom, 0px);
    --ease:cubic-bezier(.3,.9,.3,1);
  }
  [data-theme="light"]{
    --ink:#ECEEF1; --panel:#FFFFFF; --panel-soft:#F6F7F9; --panel-raised:#E6E9EE;
    --line:rgba(16,22,32,0.07); --line-strong:rgba(16,22,32,0.13);
    --text:#14171C; --text-dim:#5B626E; --text-faint:#98A0AC;
    --amber:#B87400; --amber-ink:#FFFFFF; --amber-soft:rgba(184,116,0,0.12); --live:#17864B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--text); font-family:'Inter',-apple-system,sans-serif; font-weight:500;}
  body{transition:background .25s ease, color .25s ease; padding-bottom:calc(70px + var(--safe-b));}
  button{font-family:inherit; color:inherit; background:none; border:none; padding:0; -webkit-appearance:none; appearance:none; cursor:pointer;}
  input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  ::selection{background:var(--amber); color:#1B1D22;}
  .mono{font-family:'Space Mono', monospace;}
  svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block;}

  /* ============ HEADER ============ */
  header{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--panel) 88%, transparent);
    -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;}
  .toprow{display:flex; align-items:center; gap:11px; max-width:640px; margin:0 auto;}
  .mark{width:40px; height:40px; border-radius:12px; flex-shrink:0; background:#0B0D12; border:1px solid rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    font-family:'Manrope',sans-serif; font-weight:800; font-size:14.5px; color:#F1EFE9; letter-spacing:.3px;
    box-shadow:0 4px 14px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.08);}
  .mark::after{content:''; position:absolute; left:8px; right:8px; bottom:6px; height:2px; border-radius:2px; background:var(--amber); opacity:.95;}
  [data-theme="light"] .mark::after{background:#FFB020;}
  .titleblock{flex:1; min-width:0;}
  .titleblock h1{margin:0; font-size:18px; font-weight:800; font-family:'Manrope',sans-serif; line-height:1.1; letter-spacing:-.4px;}
  .titleblock .sub{font-size:11px; font-weight:600; color:var(--text-dim); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .titleblock .sub b{color:var(--amber); font-weight:700;}
  .clock{text-align:right; flex-shrink:0; line-height:1;}
  .clock .t{font-family:'Space Mono',monospace; font-weight:700; font-size:17px; letter-spacing:-.5px; font-variant-numeric:tabular-nums;}
  .clock .t .colon{animation:blink 1s steps(1) infinite;}
  .clock .t small{font-size:9.5px; color:var(--text-dim); margin-left:2px; letter-spacing:0;}
  .clock .d{font-size:10px; color:var(--text-dim); font-weight:600; margin-top:4px;}
  @keyframes blink{50%{opacity:.15;}}
  .icon-btn{width:38px; height:38px; border-radius:11px; border:1px solid var(--line-strong); background:var(--panel-soft);
    color:var(--text); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .15s ease;}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn svg.i{width:18px; height:18px;}
  .icon-btn svg.ico-sun{display:none;} [data-theme="light"] .icon-btn svg.ico-sun{display:block;} [data-theme="light"] .icon-btn svg.ico-moon{display:none;}

  main{max-width:640px; margin:0 auto; padding:12px 16px 0;}
  .view{animation:view-in .28s var(--ease) both;}
  @keyframes view-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ============ NOW / NEXT BOARD (signature element) ============ */
  .ticker-panel{position:relative; background:linear-gradient(180deg,#0E1116 0%, #08090C 100%); border:1px solid rgba(255,255,255,0.08);
    border-radius:var(--radius); overflow:hidden; margin-bottom:10px; box-shadow:0 10px 30px -12px rgba(0,0,0,.55);}
  [data-theme="light"] .ticker-panel{background:linear-gradient(180deg,#1A1E25 0%, #12151A 100%); box-shadow:0 12px 28px -14px rgba(16,22,32,.45);}
  .ticker-panel::before{content:''; position:absolute; top:0; left:0; right:0; height:1.5px; z-index:2; pointer-events:none;
    background:linear-gradient(90deg, transparent, #FFB020, transparent) no-repeat; background-size:35% 100%;
    animation:tk-scan 5.5s linear infinite; opacity:.9;}
  @keyframes tk-scan{from{background-position:-60% 0;} to{background-position:160% 0;}}

  .ticker-head{display:flex; align-items:stretch; padding:13px 14px 12px;}
  .tk-col{flex:1; min-width:0; display:flex; flex-direction:column; --sc:#3A3F4A;}
  .tk-col + .tk-col{border-left:1px solid rgba(255,255,255,0.08); padding-left:12px; margin-left:12px;}
  .tk-label{font-family:'Space Mono',monospace; font-weight:700; font-size:9px; letter-spacing:1.4px; text-transform:uppercase;
    color:#8A90A0; display:flex; align-items:center; gap:5px; margin-bottom:8px; white-space:nowrap; min-height:20px;}
  .tk-chip{margin-left:auto; font-size:9.5px; letter-spacing:.2px; text-transform:none; color:#D7DAE0;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); border-radius:6px; padding:2px 6px;
    font-variant-numeric:tabular-nums; transition:background .3s, color .3s, border-color .3s;}
  .tk-next.soon .tk-chip{background:#FFB020; color:#14161B; border-color:#FFB020; animation:tk-chip 1.3s ease-out infinite;}
  @keyframes tk-chip{0%{box-shadow:0 0 0 0 rgba(255,176,32,.55);} 100%{box-shadow:0 0 0 7px rgba(255,176,32,0);}}
  .tk-arrow{color:#FFB020; font-size:10px; display:inline-block; animation:tk-nudge 1.4s ease-in-out infinite;}
  @keyframes tk-nudge{0%,100%{transform:translateX(0); opacity:.55;} 50%{transform:translateX(3px); opacity:1;}}

  .live-dot{width:6px; height:6px; border-radius:50%; background:#5FD68A; flex-shrink:0; display:inline-block;}
  .live-dot.amber{background:#FFB020;}
  .live-dot.idle{background:#4A505C;}
  .live-dot.pulsing{animation:pulse 1.6s ease-in-out infinite;}
  .live-dot.amber.pulsing{animation-name:pulse-amber;}
  @keyframes pulse{0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(95,214,138,.5);} 50%{opacity:.6; box-shadow:0 0 0 4px rgba(95,214,138,0);}}
  @keyframes pulse-amber{0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(255,176,32,.5);} 50%{opacity:.6; box-shadow:0 0 0 4px rgba(255,176,32,0);}}

  .tk-body{position:relative; display:block; width:100%; text-align:left; font:inherit; color:inherit; padding:1px 0 1px 11px; margin:0;
    min-width:0; cursor:default; animation:tk-in .5s var(--ease) both;}
  .tk-body::before{content:''; position:absolute; left:0; top:1px; bottom:1px; width:3px; border-radius:2px; background:var(--sc);}
  .tk-col.glow .tk-body::before{animation:tk-breathe 2.8s ease-in-out .5s infinite;}
  button.tk-body{cursor:pointer;}
  .tk-next .tk-body{animation-delay:.08s;}
  @keyframes tk-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes tk-breathe{0%,100%{box-shadow:0 0 4px 0 var(--sc); opacity:.85;} 50%{box-shadow:0 0 12px 2px var(--sc); opacity:1;}}

  .tk-main{font-family:'Space Mono',monospace; font-weight:700; font-size:19px; color:#F5D9A0; line-height:1.12; letter-spacing:-.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tk-main.soft{font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; color:#E4E6EB; letter-spacing:-.1px;}
  .tk-main.dim{font-family:'Manrope',sans-serif; font-weight:700; font-size:14.5px; color:#7A8190; letter-spacing:0;}
  .tk-name{font-size:10.5px; font-weight:600; color:#C3C7CF; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tk-meta{font-size:10px; color:#858B97; margin-top:2px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tk-meta b{color:#D7DAE0; font-weight:700;}

  .tk-prog{margin-top:auto; padding-top:9px;}
  .tk-prog .bar{height:4px; border-radius:3px; background:rgba(255,255,255,0.07); overflow:hidden;}
  .tk-prog .bar i{display:block; height:100%; width:0; border-radius:3px; background:var(--sc); position:relative; overflow:hidden;
    box-shadow:0 0 8px var(--sc); transition:width 1s linear;}
  .tk-prog .bar i::after{content:''; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation:tk-shimmer 2.4s ease-in-out infinite;}
  @keyframes tk-shimmer{to{transform:translateX(100%);}}
  .tk-span{display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:8.5px; color:#5F6570; margin-top:4px;}

  /* ticker tape: today's lineup, merged into blocks with live/done state */
  .ticker-tape{border-top:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.015); overflow:hidden; white-space:nowrap; padding:7px 0;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);}
  .ticker-track{display:inline-block; animation:scroll-left 30s linear infinite; will-change:transform;}
  @keyframes scroll-left{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  .tt-item{font-family:'Space Mono',monospace; font-size:10.5px; color:#8A90A0; padding:0 4px; letter-spacing:.2px; display:inline-flex; align-items:center; gap:6px;}
  .tt-item b{color:#D7DAE0; font-weight:700;}
  .tt-item i{font-style:normal; color:#646B78;}
  .tt-item .st{font-size:8.5px; font-weight:700; letter-spacing:.8px; padding:1px 5px; border-radius:4px;}
  .tt-item.live b{color:#F5D9A0;}
  .tt-item.live .st{color:#0B0D12; background:#5FD68A;}
  .tt-item.done{opacity:.45;}
  .tt-item.done .st{color:#8A90A0; border:1px solid rgba(255,255,255,.12);}
  .tt-item.up .st{color:#FFB020; border:1px solid rgba(255,176,32,.35);}
  .tt-sep{color:#3A404B; font-size:8px; padding:0 14px; vertical-align:middle;}

  /* ============ MILESTONE STRIP ============ */
  .milestone-chip{display:flex; align-items:center; gap:11px; background:var(--panel); border:1px solid var(--line); border-radius:13px;
    padding:7px 10px 7px 7px; margin-bottom:10px; width:100%; text-align:left; transition:transform .15s ease, border-color .2s;}
  .milestone-chip:active{transform:scale(.985);}
  .mc-date{flex-shrink:0; width:36px; height:36px; border-radius:9px; background:var(--panel-raised); display:flex; flex-direction:column;
    align-items:center; justify-content:center; line-height:1; overflow:hidden; position:relative;}
  .mc-date .m{font-size:8px; font-weight:700; color:var(--amber); letter-spacing:.3px;}
  .mc-date .dd{font-family:'Space Mono',monospace; font-weight:700; font-size:15px; margin-top:2px;}
  .mc-body{flex:1; min-width:0;}
  .mc-body .k{font-size:9.5px; color:var(--text-dim); font-weight:600;}
  .mc-body .l{font-family:'Manrope',sans-serif; font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .mc-count{flex-shrink:0; font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; color:var(--text-dim);
    background:var(--panel-raised); border-radius:7px; padding:4px 7px;}
  .mc-count.hot{color:var(--amber); background:var(--amber-soft);}

  /* ============ CONTROLS ROW ============ */
  .viewtoggle{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:9px;}
  .now-btn{display:flex; align-items:center; gap:7px; background:var(--amber-soft); border:1px solid color-mix(in srgb, var(--amber) 45%, transparent);
    color:var(--amber); border-radius:10px; padding:0 13px; font-size:11.5px; font-weight:700; height:34px; transition:transform .15s ease;}
  .now-btn:active{transform:scale(.95);}
  .now-btn .live-dot{background:var(--amber); animation-name:pulse-amber;}
  .seg{position:relative; display:grid; grid-template-columns:1fr 1fr; background:var(--panel); border:1px solid var(--line-strong);
    border-radius:11px; padding:3px; width:132px; height:34px;}
  .seg-thumb{position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); background:var(--amber); border-radius:8px;
    transition:transform .3s var(--ease); box-shadow:0 2px 8px -2px color-mix(in srgb, var(--amber) 60%, transparent);}
  .seg[data-v="grid"] .seg-thumb{transform:translateX(100%);}
  .seg button{position:relative; z-index:1; font-size:11.5px; font-weight:700; color:var(--text-dim); transition:color .25s;}
  .seg button.active{color:var(--amber-ink);}

  /* ============ SUBJECT FILTER CHIPS ============ */
  .legend{display:flex; flex-wrap:wrap; gap:5px; padding-bottom:9px;}
  .chip{display:flex; align-items:center; gap:5px; padding:0 9px; height:27px; border-radius:999px; border:1px solid var(--line-strong);
    background:var(--panel); font-size:10.5px; font-weight:700; color:var(--text-dim); transition:background .2s, border-color .2s, color .2s, transform .12s;}
  .chip:active{transform:scale(.94);}
  .chip .sw{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .chip.active{color:var(--text); border-color:var(--cc, var(--amber)); background:color-mix(in srgb, var(--cc, var(--amber)) 20%, var(--panel));}
  .chip.all.active{background:var(--amber); color:var(--amber-ink); border-color:var(--amber);}

  /* ============ GRID (days as rows, times as columns — one screen, no scroll) ============ */
  .gridwrap{position:relative; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--panel);
    margin:0 -16px 0; padding:2px 0;}
  table.tt{border-collapse:collapse; width:100%; table-layout:fixed; background:var(--panel);}
  table.tt thead th{background:var(--panel); font-family:'Space Mono',monospace; font-size:9px; color:var(--text-dim); font-weight:700;
    padding:7px 1px 6px; text-align:center; border-bottom:1px solid var(--line-strong); letter-spacing:-.2px; transition:color .3s;}
  table.tt thead th .th-start{display:block; font-weight:700;}
  table.tt thead th .th-end{display:block; font-weight:700; font-size:8.5px; margin-top:1px; opacity:.8;}
  table.tt thead th.th-now{color:var(--amber);}
  table.tt thead th.th-now .th-end{opacity:1;}
  table.tt thead th.mark-h{color:var(--text-faint); font-size:7.5px; letter-spacing:0;}
  table.tt thead th.mark-h.th-now{color:var(--amber);}
  table.tt td{background:var(--panel); border-bottom:1px solid var(--line); padding:3px 2px; vertical-align:middle; text-align:center;}
  table.tt td.daylabel{font-family:'Manrope',sans-serif; font-weight:800; font-size:11.5px; text-align:left; padding-left:14px; letter-spacing:-.1px; position:relative;}
  table.tt tr.today-row td{background:color-mix(in srgb, var(--amber) 7%, var(--panel));}
  table.tt tr.today-row td.daylabel{color:var(--amber);}
  table.tt tr.today-row td.daylabel::before{content:''; position:absolute; left:0; top:5px; bottom:5px; width:3px; border-radius:0 3px 3px 0; background:var(--amber);}
  table.tt tr:last-child td{border-bottom:none;}
  table.tt td.mark-c{padding:3px 0;}
  table.tt td.mark-c::after{content:''; display:block; margin:0 auto; width:3px; height:20px; border-radius:2px;
    background:repeating-linear-gradient(135deg, var(--line-strong) 0, var(--line-strong) 1.5px, transparent 1.5px, transparent 4px);}
  table.tt td.mark-c.mark-live::after{background:var(--amber); box-shadow:0 0 6px var(--amber);}
  .cell-block{border-radius:8px; padding:6px 1px; font-size:8.6px; font-weight:800; color:#0D0F13; line-height:1.08;
    min-height:33px; width:100%; display:flex; align-items:center; justify-content:center; letter-spacing:-.2px; overflow-wrap:anywhere;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.32), inset 0 -2px 0 rgba(0,0,0,0.13);
    transition:opacity .3s, transform .12s, filter .3s; position:relative; z-index:2;}
  button.cell-block:active{transform:scale(.92);}
  .cell-block.cell-past{opacity:.4;}
  .cell-block.cell-dim{opacity:.18;}
  .cell-block.cell-now{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--amber), inset 0 1px 0 rgba(255,255,255,0.32); animation:cellglow 2s ease-in-out infinite;}
  .cell-block.cell-next{box-shadow:0 0 0 2px var(--panel), 0 0 0 3.5px color-mix(in srgb, var(--amber) 50%, transparent), inset 0 1px 0 rgba(255,255,255,0.32);}
  @keyframes cellglow{50%{filter:brightness(1.12) drop-shadow(0 0 6px color-mix(in srgb, var(--amber) 70%, transparent));}}
  .cell-empty{color:var(--text-faint); background:transparent !important; box-shadow:none !important; font-weight:400 !important; opacity:.7;}
  .grid-needle{position:absolute; width:2px; border-radius:2px; pointer-events:none; z-index:1; display:none;
    background:linear-gradient(180deg, var(--amber), color-mix(in srgb, var(--amber) 35%, transparent)); box-shadow:0 0 8px color-mix(in srgb, var(--amber) 60%, transparent);}
  .grid-needle.ready{transition:left 1s linear;}
  .grid-needle::before{content:''; position:absolute; top:-4px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 0 2px var(--panel);}
  .grid-key{font-size:9.5px; color:var(--text-faint); text-align:center; margin:9px 0 16px; letter-spacing:.1px;}

  /* ============ DAY VIEW ============ */
  .daypicker{display:grid; grid-template-columns:repeat(6,1fr); gap:5px; margin-bottom:9px;}
  .day-pill{background:var(--panel); border:1px solid var(--line-strong); color:var(--text-dim); border-radius:11px;
    padding:5px 0 9px; font-size:12px; font-weight:800; font-family:'Manrope',sans-serif; text-align:center; min-height:42px; position:relative;
    transition:background .2s, color .2s, border-color .2s, transform .12s;}
  .day-pill:active{transform:scale(.94);}
  .day-pill .dn{display:block; font-family:'Inter',sans-serif; font-size:8.5px; font-weight:600; opacity:.75; margin-bottom:1px;}
  .day-pill.active{background:var(--amber); color:var(--amber-ink); border-color:var(--amber);}
  .day-pill.today::after{content:''; position:absolute; bottom:3px; left:50%; margin-left:-2.5px; width:5px; height:5px; border-radius:50%; background:var(--amber);}
  .day-pill.active.today::after{background:var(--amber-ink);}
  .period-list{display:flex; flex-direction:column; gap:5px; margin-bottom:16px;}
  .period-row{position:relative; display:flex; align-items:center; gap:9px; background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:7px 10px; min-height:42px; text-align:left; width:100%; overflow:hidden; transition:transform .12s;}
  button.period-row:active{transform:scale(.985);}
  .period-row > *{position:relative; z-index:1;}
  .period-row.empty{cursor:default; opacity:.5; min-height:34px;}
  .period-row.break-row{background:transparent; border-style:dashed; padding:3px 10px; opacity:.55; cursor:default; min-height:auto;}
  .period-row.break-row.live{opacity:1; border-color:var(--amber);}
  .period-row.past{opacity:.5;}
  .period-row.now-row{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 8px 20px -10px color-mix(in srgb, var(--amber) 60%, transparent);}
  .period-row.now-row::before{content:''; position:absolute; left:0; top:0; bottom:0; width:var(--p, 0%); z-index:0;
    background:linear-gradient(90deg, color-mix(in srgb, var(--amber) 6%, transparent), color-mix(in srgb, var(--amber) 22%, transparent)); border-right:2px solid var(--amber); transition:width 1s linear;}
  .period-row.now-row .p-code{color:var(--amber);}
  .period-row.next-row{border-color:color-mix(in srgb, var(--amber) 55%, transparent);}
  .p-time{flex-shrink:0; width:52px; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--text-dim); display:flex; flex-direction:column; justify-content:center; line-height:1.3;}
  .p-time b{color:var(--text); font-weight:700;}
  .p-bar{width:4px; align-self:stretch; border-radius:3px; flex-shrink:0;}
  .p-body{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center;}
  .p-code{font-family:'Manrope',sans-serif; font-weight:800; font-size:13px; display:flex; align-items:center; gap:6px; color:var(--text); line-height:1.2;}
  .p-sub{font-size:10px; color:var(--text-dim); margin-top:2px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .p-break-label{font-size:9.5px; color:var(--text-faint); letter-spacing:.2px; font-weight:600;}
  .period-row.break-row.live .p-break-label{color:var(--amber);}
  .tag{flex-shrink:0; font-family:'Space Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.4px; border-radius:6px; padding:3px 6px;}
  .tag.next{color:var(--amber); border:1px solid var(--amber);}
  .tag.live{color:#0B0D12; background:var(--live);}

  /* ============ BOTTOM SHEET ============ */
  .sheet-overlay{position:fixed; inset:0; background:rgba(4,6,10,0.6); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--panel); border-radius:22px 22px 0 0;
    padding:10px 18px calc(22px + var(--safe-b)); max-width:640px; margin:0 auto; transform:translateY(100%); transition:transform .38s var(--ease);
    border-top:1px solid var(--line-strong); max-height:86vh; overflow-y:auto; --sc:var(--amber);}
  .sheet::before{content:''; position:absolute; top:0; left:22px; right:22px; height:3px; border-radius:0 0 3px 3px; background:var(--sc);}
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:38px; height:4px; border-radius:3px; background:var(--line-strong); margin:4px auto 14px;}
  .sh-head{display:flex; align-items:center; gap:9px;}
  .sh-dot{width:12px; height:12px; border-radius:4px; background:var(--sc); flex-shrink:0; box-shadow:0 0 10px var(--sc);}
  .sh-code{font-family:'Space Mono',monospace; font-weight:700; font-size:22px; letter-spacing:-.5px;}
  .sh-cc{font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; color:var(--text-dim); background:var(--panel-raised); border-radius:6px; padding:3px 7px;}
  .sh-close{margin-left:auto; width:32px; height:32px; border-radius:50%; background:var(--panel-raised); display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
  .sh-close svg.i{width:15px; height:15px;}
  .sh-name{font-family:'Manrope',sans-serif; font-weight:700; font-size:15.5px; margin:8px 0 14px; line-height:1.3;}
  .sh-tiles{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .sh-tile{background:var(--panel-soft); border:1px solid var(--line); border-radius:12px; padding:9px 11px; min-width:0;}
  .sh-tile span{display:block; font-size:9.5px; color:var(--text-dim); font-weight:600;}
  .sh-tile b{display:block; font-size:12.5px; font-weight:700; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sh-note{font-size:11.5px; color:var(--text-dim); background:var(--panel-soft); border-radius:12px; padding:10px 12px; line-height:1.45;}
  .sh-sub{font-size:11px; font-weight:700; color:var(--text-dim); margin:16px 0 6px; display:flex; justify-content:space-between;}
  .sh-sess{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:12px;}
  .sh-sess .dname{font-family:'Manrope',sans-serif; font-weight:800; width:36px;}
  .sh-sess .tm{font-family:'Space Mono',monospace; font-size:11px; color:var(--text-dim); flex:1;}
  .sh-sess.is-next .tm{color:var(--text);}

  /* ============ TIMELINE TAB ============ */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:15px 15px 13px; margin-bottom:18px;}
  .sem-top{display:flex; justify-content:space-between; align-items:flex-end; gap:10px;}
  .sem-top .t1{font-family:'Manrope',sans-serif; font-weight:800; font-size:17px; letter-spacing:-.3px;}
  .sem-top .t2{font-size:11px; color:var(--text-dim); margin-top:3px; font-weight:600;}
  .sem-top .pct{font-family:'Space Mono',monospace; font-size:26px; color:var(--amber); font-weight:700; line-height:1; letter-spacing:-1px;}
  .sem-bar{position:relative; height:8px; background:var(--panel-raised); border-radius:5px; margin:14px 0 7px;}
  .sem-fill{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:5px; background:linear-gradient(90deg, color-mix(in srgb, var(--amber) 55%, transparent), var(--amber));
    transition:width 1.1s var(--ease);}
  .sem-tick{position:absolute; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:var(--panel); border:2px solid var(--text-faint);}
  .sem-tick.done{border-color:var(--amber); background:var(--amber);}
  .sem-ends{display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--text-faint);}
  .tl-group{font-family:'Manrope',sans-serif; font-weight:800; font-size:13.5px; margin:4px 0 8px; display:flex; align-items:center; gap:8px;}
  .tl-group .n{font-family:'Space Mono',monospace; color:var(--text-faint); font-size:10.5px; font-weight:700;}
  .tl{position:relative; margin-bottom:20px;}
  .tl::before{content:''; position:absolute; left:7px; top:14px; bottom:14px; width:2px; background:var(--line-strong); border-radius:2px;}
  .tl-item{position:relative; display:flex; align-items:center; gap:11px; padding:8px 10px 8px 26px; border-radius:12px;}
  .tl-node{position:absolute; left:2px; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:var(--ink); border:2px solid var(--text-faint);}
  .tl-item.done .tl-node{background:var(--text-faint); border-color:var(--text-faint);}
  .tl-item.done{opacity:.55;}
  .tl-item.next{background:var(--panel); margin-left:-1px; border:1px solid color-mix(in srgb, var(--amber) 50%, transparent); margin:4px 0;
    box-shadow:0 10px 24px -14px color-mix(in srgb, var(--amber) 70%, transparent);}
  .tl-item.next .tl-node{border-color:var(--amber); background:var(--amber); animation:pulse-amber 1.8s ease-in-out infinite; left:1px;}
  .tl-date{flex-shrink:0; width:44px; text-align:center; line-height:1;}
  .tl-date b{display:block; font-family:'Space Mono',monospace; font-size:19px; font-weight:700;}
  .tl-date span{display:block; font-size:9px; color:var(--text-dim); font-weight:600; margin-top:3px;}
  .tl-body{flex:1; min-width:0;}
  .tl-label{font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; line-height:1.3;}
  .tl-when{font-family:'Space Mono',monospace; font-size:10px; color:var(--text-dim); margin-top:3px;}
  .tl-item.next .tl-when{color:var(--amber); font-weight:700;}
  .tl-item.soon .tl-when{color:var(--amber);}
  .tl-today{position:relative; display:flex; align-items:center; gap:8px; padding:6px 0 6px 26px; font-size:10px; font-weight:700; color:var(--amber);}
  .tl-today::before{content:''; position:absolute; left:0; top:50%; width:16px; height:2px; background:var(--amber); margin-top:-1px;}
  .tl-today::after{content:''; flex:1; height:1px; background:linear-gradient(90deg, color-mix(in srgb, var(--amber) 50%, transparent), transparent);}

  /* ============ COURSES TAB ============ */
  .load-top{display:flex; align-items:baseline; justify-content:space-between;}
  .load-top .big{font-family:'Space Mono',monospace; font-size:28px; font-weight:700; letter-spacing:-1px; line-height:1;}
  .load-top .big small{font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--text-dim); letter-spacing:0; margin-left:5px;}
  .load-top .side{font-size:11px; color:var(--text-dim); font-weight:600; text-align:right;}
  .load-top .side b{color:var(--text); font-family:'Space Mono',monospace;}
  .load-bar{display:flex; gap:2px; height:10px; margin:13px 0 9px; border-radius:5px; overflow:hidden;}
  .load-bar i{display:block; height:100%; transform-origin:left; animation:grow .7s var(--ease) both;}
  @keyframes grow{from{transform:scaleX(0);}}
  .load-keys{display:flex; flex-wrap:wrap; gap:4px 10px;}
  .load-keys span{display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:700; color:var(--text-dim);}
  .load-keys span i{width:7px; height:7px; border-radius:2px; display:inline-block;}
  .load-keys span em{font-style:normal; font-family:'Space Mono',monospace; color:var(--text-faint);}
  .searchwrap{position:relative; margin-bottom:14px;}
  .searchwrap svg.i{position:absolute; left:13px; top:50%; margin-top:-9px; width:18px; height:18px; color:var(--text-faint); pointer-events:none;}
  .searchbox{width:100%; padding:0 40px 0 40px; height:46px; border-radius:13px; border:1px solid var(--line-strong); background:var(--panel);
    color:var(--text); font-size:13.5px; transition:border-color .2s, box-shadow .2s;}
  .searchbox::placeholder{color:var(--text-faint);}
  .searchbox::-webkit-search-cancel-button, .searchbox::-webkit-search-decoration{-webkit-appearance:none; appearance:none; display:none;}
  .searchbox:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px var(--amber-soft);}
  .search-clear{position:absolute; right:8px; top:50%; margin-top:-15px; width:30px; height:30px; border-radius:50%; display:none; align-items:center; justify-content:center; color:var(--text-dim);}
  .search-clear.show{display:flex;}
  .search-clear svg.i{position:static; margin:0; width:15px; height:15px;}
  .section-title{font-family:'Manrope',sans-serif; font-weight:800; font-size:13.5px; margin:2px 0 10px; display:flex; align-items:center; gap:7px;}
  .section-title .n{font-family:'Space Mono',monospace; color:var(--text-faint); font-size:10.5px;}
  .course-table{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel); margin-bottom:8px;}
  .course-row{position:relative; display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:12px 12px 12px 15px; border-bottom:1px solid var(--line); transition:filter .15s;}
  .course-row::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--cc);}
  .course-row:active{filter:brightness(1.08);}
  .course-row:last-child{border-bottom:none;}
  .cr-main{flex:1; min-width:0;}
  .cr-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .cr-code{font-family:'Manrope',sans-serif; font-weight:800; font-size:14.5px; color:var(--text);}
  .cr-coursecode{font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; color:var(--text); background:rgba(0,0,0,0.22); padding:2px 7px; border-radius:6px; letter-spacing:.2px;}
  [data-theme="light"] .cr-coursecode{background:rgba(0,0,0,0.07);}
  .cr-freq{font-family:'Space Mono',monospace; font-size:9px; font-weight:700; color:var(--text-dim); background:rgba(0,0,0,0.14); padding:2px 6px; border-radius:6px;}
  [data-theme="light"] .cr-freq{background:rgba(0,0,0,0.05);}
  .cr-name{font-size:12px; color:var(--text); opacity:.92; margin-top:4px; line-height:1.35;}
  .cr-meta{font-size:10.5px; color:var(--text-dim); margin-top:3px;}
  .cr-flag{display:inline-block; font-size:9px; font-weight:700; color:var(--text-dim); background:var(--panel-raised); border-radius:6px; padding:2px 7px; margin-top:6px;}
  .cr-sessions{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px;}
  .cr-sessions span{font-family:'Space Mono',monospace; font-size:9px; color:var(--text-dim); background:rgba(0,0,0,0.16); border-radius:6px; padding:3px 6px;}
  [data-theme="light"] .cr-sessions span{background:rgba(0,0,0,0.05);}
  .cr-credits{flex-shrink:0; width:40px; height:40px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:2px solid color-mix(in srgb, var(--cc) 70%, transparent); background:color-mix(in srgb, var(--cc) 12%, transparent);}
  .cr-credits .n{font-family:'Space Mono',monospace; font-weight:700; font-size:14px; line-height:1;}
  .cr-credits .lbl{font-size:7px; color:var(--text-dim); font-weight:700; margin-top:1px;}
  .lookup-empty{text-align:center; color:var(--text-faint); font-size:12px; padding:30px 10px; line-height:1.6;}

  /* ============ BOTTOM NAV ============ */
  nav.bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:40; background:color-mix(in srgb, var(--panel) 88%, transparent);
    -webkit-backdrop-filter:saturate(1.4) blur(16px); backdrop-filter:saturate(1.4) blur(16px);
    border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b);}
  .nav-btn{flex:1; color:var(--text-faint); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:8px 4px 8px; min-height:62px; transition:color .2s;}
  .nav-btn .ni{width:58px; height:30px; border-radius:15px; display:flex; align-items:center; justify-content:center; transition:background .3s var(--ease), transform .2s;}
  .nav-btn .nl{font-size:10.5px; font-weight:700; letter-spacing:.1px;}
  .nav-btn.active{color:var(--amber);}
  .nav-btn.active .ni{background:var(--amber-soft);}
  .nav-btn:active .ni{transform:scale(.9);}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *, *::before, *::after{animation:none !important; transition:none !important;}
    .ticker-panel::before, .tk-prog .bar i::after{display:none;}
  }
</style>
</head>
<body>

<header id="pageHeader">
  <div class="toprow">
    <div class="mark" aria-hidden="true">MK</div>

/* ================= DATA ================= */
const PERIODS = [

const DAYS = Object.keys(SCHEDULE);

const COURSES = {
  IAPM1: {name:"Investment Analysis & Portfolio Management", code:"24GA03", faculty:"Dr. D. Susana", room:"Trading Lab", credits:3, color:"var(--c-iapm1)"},
  FD1:   {name:"Financial Derivatives", code:"24GA04", faculty:"Dr. J. Ravi Shankar", room:"Trading Lab", credits:3, color:"var(--c-fd1)"},
  PM1:   {name:"Project Management", code:"24GD03", faculty:"Dr V Harish", room:"Room 411", credits:3, color:"var(--c-pm1)"},
  MFS1:  {name:"Marketing of Financial Services", code:"24VA04", faculty:"Dr. Nithya", room:"Trading Lab", credits:2, color:"var(--c-mfs1)"},

  {date:"2027-05-15", label:"Graduation Day", sem:"IV"},
];
const TERM_START = new Date("2026-07-20T00:00:00");
const TERM_END   = new Date("2026-11-23T23:59:59");

const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY_ABBR = {Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thu",Friday:"Fri",Saturday:"Sat"};

const DAY_MS = 86400000;

/* ================= TIME HELPERS ================= */
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function currentMinutes(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function nowSeconds(){ const n=new Date(); return n.getHours()*3600+n.getMinutes()*60+n.getSeconds(); }
function todayName(){
  const n = REAL_DAY_NAMES[new Date().getDay()];
  return SCHEDULE[n] ? n : null;
}
function today0(){ return new Date(new Date().toDateString()); }
function fmtTime(t){
  const [h,m] = t.split(':').map(Number);
  const ap = h>=12?'pm':'am';
  const hh = h%12===0?12:h%12;
  return hh+(m?':'+String(m).padStart(2,'0'):'')+ap;
}
function fmtTimeShort(t){
  const [h,m] = t.split(':').map(Number);
  const hh = h%12===0?12:h%12;
  return hh+':'+String(m).padStart(2,'0');
}
function fmtMin(m){ return fmtTime(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')); }
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(d > 0) return `${d}d ${h}h`;
  if(h > 0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function joinMeta(...parts){ return parts.filter(x => x && x !== '—').join(' · '); }
function semesterWeek(){
  const t = today0();
  const total = Math.floor((TERM_END - TERM_START) / (7*DAY_MS)) + 1;
  if(t < TERM_START || t > TERM_END) return null;
  return {n: Math.floor((t - TERM_START) / (7*DAY_MS)) + 1, total};
}

// Merge adjacent class periods holding the same code (no break in between)
// into one block — e.g. FD1 8:30–10:20 instead of two separate hours.
function classBlock(sched, idx){
  const code = sched[idx];
  let s = idx, e = idx;
  while(s-1 >= 0 && !PERIODS[s-1].type && sched[s-1] === code) s--;
  while(e+1 < PERIODS.length && !PERIODS[e+1].type && sched[e+1] === code) e++;
  return {s, e, startMin:toMin(PERIODS[s].start), endMin:toMin(PERIODS[e].end)};
}
// All class blocks in a day (optionally only for one subject).
function dayBlocks(dayName, onlyCode){
  const sched = SCHEDULE[dayName]; const out = [];
  if(!sched) return out;
  for(let idx=0; idx<PERIODS.length; idx++){
    if(PERIODS[idx].type || !sched[idx]) continue;
    if(onlyCode && sched[idx] !== onlyCode) continue;
    const b = classBlock(sched, idx);
    if(b.s === idx) out.push({code:sched[idx], ...b, periods:b.e - b.s + 1 - countBreaks(b.s, b.e)});
  }
  return out;
}
function countBreaks(s, e){ let n=0; for(let i=s;i<=e;i++) if(PERIODS[i].type) n++; return n; }

/* ================= INIT / REFRESH ================= */
selectedDay = todayName() || "Monday";
let lastKnownToday = todayName();

/* Re-renders everything that's date/time-dependent. Called on a timer while
   the app is open, and again whenever the app comes back to the foreground —
   phones suspend timers when the screen locks or the app is backgrounded, so
   the timer alone can't be trusted to catch a day rollover on its own. */
function refreshAll(){
  const nowToday = todayName();
  if(nowToday !== lastKnownToday){
    if(selectedDay === lastKnownToday || selectedDay === null){ selectedDay = nowToday || "Monday"; }
    lastKnownToday = nowToday;
    renderDayPicker();
  }
  renderHeader();
  renderPeriodList();
  renderGrid();
  renderNowNext();
  renderTicker();
  renderMilestoneChip();
  if(document.getElementById('view-timeline').style.display !== 'none'){ renderTimeline(); }
}

function secondTick(){
  if(document.hidden) return;
  renderClock();
  renderNowNext();
  positionGridNeedle();
  tickDayRow();
}

function init(){
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches){
    document.documentElement.setAttribute('data-theme','light');
  }
  syncThemeColor();
  renderHeader();
  renderClock();
  renderLegend();
  renderDayPicker();
  renderPeriodList();
  renderGrid();
  renderNowNext();
  renderTicker();
  renderMilestoneChip();
  renderTimeline();
  scrollToCurrentRow();
  requestAnimationFrame(positionGridNeedle);

  setInterval(refreshAll, 30000);
  setInterval(secondTick, 1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ refreshAll(); } });
  window.addEventListener('focus', refreshAll);
  window.addEventListener('pageshow', refreshAll);
  window.addEventListener('resize', positionGridNeedle);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(positionGridNeedle); }
}

function renderDayPicker(){

function nextClassAfter(nowMin, sched){
  for(let idx=0; idx<PERIODS.length; idx++){
    const p = PERIODS[idx];
    if(p.type) continue;
    if(toMin(p.start) > nowMin && sched[idx]){ return {period:p, code:sched[idx]}; }
  }
  return null;
}

function renderPeriodList(){
  const el = document.getElementById('periodList');
  const sched = SCHEDULE[selectedDay];
  const isToday = selectedDay === todayName();
  const nowMin = currentMinutes();
  const nextSlot = isToday ? nextClassAfter(nowMin, sched) : null;
  const timeCol = p => `<div class="p-time"><b>${fmtTime(p.start)}</b>${fmtTime(p.end)}</div>`;
  let html = '';
  PERIODS.forEach((p,idx)=>{
    const isNow = isToday && nowMin>=toMin(p.start) && nowMin<toMin(p.end);
    const isPast = isToday && toMin(p.end) <= nowMin;
    if(p.type){
      html += `<div class="period-row break-row ${isNow?'live':''}">
        <div class="p-time" style="flex-direction:row; width:auto; gap:4px">${fmtTime(p.start)}–${fmtTime(p.end)}</div>
        <div class="p-body"><div class="p-break-label">${p.type==='lunch'?'Lunch break':'Short break'}${isNow?' · now':''}</div></div></div>`;
      return;
    }
    const code = sched[idx];
    const isNext = isToday && nextSlot && nextSlot.period.i===p.i;
    if(code && activeSubjectFilter!=='all' && code!==activeSubjectFilter){
      html += `<div class="period-row empty">${timeCol(p)}<div class="p-body"><div class="p-sub">${code} · hidden by filter</div></div></div>`;
      return;
    }
    if(code){
      const c = COURSES[code];
      html += `<button class="period-row ${isNow?'now-row':''} ${isNext?'next-row':''} ${isPast?'past':''}" ${isNow?`data-start="${toMin(p.start)}" data-end="${toMin(p.end)}"`:''} onclick="openSheet('${code}')">
        ${timeCol(p)}
        <div class="p-bar" style="background:${c.color}"></div>
        <div class="p-body">
          <div class="p-code">${code}</div>
          <div class="p-sub">${joinMeta(c.room, c.faculty) || c.name}</div>
        </div>
        ${isNow?'<span class="tag live">LIVE</span>':''}${isNext?'<span class="tag next">NEXT</span>':''}
      </button>`;
    } else {
      html += `<div class="period-row empty">${timeCol(p)}<div class="p-body"><div class="p-sub">Free period</div></div></div>`;
    }
  });
  el.innerHTML = html;
  tickDayRow();
}
// Fills the live row's background as the period progresses.
function tickDayRow(){
  const row = document.querySelector('#periodList .now-row');
  if(!row) return;
  const s = +row.dataset.start*60, e = +row.dataset.end*60;
  const pct = Math.min(100, Math.max(0, (nowSeconds()-s)/(e-s)*100));
  row.style.setProperty('--p', pct.toFixed(2)+'%');
}

function scrollToCurrentRow(smooth){
  requestAnimationFrame(()=>{
    const el = document.querySelector('#periodList .now-row') || document.querySelector('#periodList .next-row');
    if(el){ el.scrollIntoView({behavior: smooth ? 'smooth' : 'auto', block:'center'}); }

/* Jump-to-now: works in both Day and Grid view. */
function jumpToNow(){
  const tn = todayName();
  if(weekView === 'grid'){
    requestAnimationFrame(()=>{
      const el = document.querySelector('#gridTable .cell-now, #gridTable .cell-next') || document.querySelector('#gridTable tr.today-row');
      if(el){ (el.closest('tr') || el).scrollIntoView({behavior:'smooth', block:'center'}); }
    });

/* ================= GRID VIEW ================= */
function findNowNext(){
  const tn = todayName();
  if(!tn) return {now:null, next:null, day:null};
  const sched = SCHEDULE[tn];
  const nowMin = currentMinutes();
  let now=null, next=null;
  for(let idx=0; idx<PERIODS.length; idx++){
    const p = PERIODS[idx];
    if(nowMin>=toMin(p.start) && nowMin<toMin(p.end)){ now = {period:p, code: p.type?null:sched[idx], type:p.type||null}; }
    if(!next && toMin(p.start) > nowMin){ next = {period:p, code: p.type?null:sched[idx], type:p.type||null}; }
  }
  return {now, next, day:tn};
}

function renderGrid(){
  const el = document.getElementById('gridTable');
  const tn = todayName();
  const nowMin = currentMinutes();
  const {now} = findNowNext();
  const nextClass = tn ? nextClassAfter(nowMin, SCHEDULE[tn]) : null;

  // Full 13-column layout, matching the source timetable exactly: every class
  // period plus the short breaks (B) and lunch (L) in their original slots.
  const allCols = PERIODS.map((p, idx) => ({p, idx}));
  const classCount = allCols.filter(x => !x.p.type).length;
  const markCount = allCols.length - classCount;
  const labelPct = 12, markPct = 3.6;
  const classPct = ((100 - labelPct - markPct*markCount) / classCount).toFixed(3);

  const colgroup = `<colgroup><col style="width:${labelPct}%">` +
    allCols.map(x => `<col style="width:${x.p.type ? markPct : classPct}%">`).join('') + `</colgroup>`;

  const theadCells = `<th class="corner"></th>` + allCols.map(x=>{
    const isNowCol = now && now.period.i === x.p.i;
    if(x.p.type){ return `<th class="mark-h ${isNowCol?'th-now':''}">${x.p.type==='lunch'?'L':'B'}</th>`; }
    return `<th class="${isNowCol?'th-now':''}"><span class="th-start">${fmtTimeShort(x.p.start)}</span><span class="th-end">${fmtTimeShort(x.p.end)}</span></th>`;
  }).join('');

  const bodyRows = DAYS.map(d=>{
    const isToday = d===tn;
    const cells = allCols.map(x=>{
      if(x.p.type){
        const live = isToday && now && now.period.i===x.p.i;
        return `<td class="mark-c ${live?'mark-live':''}"></td>`;
      }
      const code = SCHEDULE[d][x.idx];
      if(!code) return `<td><div class="cell-block cell-empty">–</div></td>`;
      const isNowCell = isToday && now && !now.type && now.period.i===x.p.i;
      const isNextCell = isToday && nextClass && nextClass.period.i===x.p.i;
      const isPast = isToday && toMin(x.p.end) <= nowMin;
      const dim = activeSubjectFilter!=='all' && code!==activeSubjectFilter;
      const cls = [isNowCell?'cell-now':'', isNextCell?'cell-next':'', isPast?'cell-past':'', dim?'cell-dim':''].join(' ');
      return `<td><button class="cell-block ${cls}" style="background:${COURSES[code].color}" onclick="openSheet('${code}')" aria-label="${code} ${d} ${fmtTime(x.p.start)}">${code}</button></td>`;
    }).join('');
    return `<tr class="${isToday?'today-row':''}"><td class="daylabel">${d.slice(0,3)}</td>${cells}</tr>`;
  }).join('');

  el.innerHTML = colgroup + `<thead><tr>${theadCells}</tr></thead><tbody>${bodyRows}</tbody>`;
  positionGridNeedle();
}

/* Amber "now" needle across today's row, placed at the exact minute inside
   the current period's column (like the red line in a calendar app). */
function positionGridNeedle(){
  const wrap = document.getElementById('gridWrap'), needle = document.getElementById('gridNeedle');
  if(!wrap || !needle) return;
  const row = document.querySelector('#gridTable tr.today-row');
  const sec = nowSeconds();
  const idx = PERIODS.findIndex(p => sec >= toMin(p.start)*60 && sec < toMin(p.end)*60);
  if(!row || idx < 0 || wrap.offsetParent === null){ needle.style.display = 'none'; needle.classList.remove('ready'); return; }
  const th = document.querySelectorAll('#gridTable thead th')[idx+1];
  if(!th){ needle.style.display = 'none'; return; }
  const wr = wrap.getBoundingClientRect(), tr = th.getBoundingClientRect(), rr = row.getBoundingClientRect();
  const p = PERIODS[idx];
  const frac = (sec - toMin(p.start)*60) / ((toMin(p.end) - toMin(p.start))*60);
  needle.style.display = 'block';
  needle.style.left = (tr.left - wr.left + frac*tr.width - 1).toFixed(1) + 'px';
  const head = document.querySelector('#gridTable thead').getBoundingClientRect();
  const tb = document.getElementById('gridTable').getBoundingClientRect();
  needle.style.top = (head.bottom - wr.top) + 'px';
  needle.style.height = (tb.bottom - head.bottom - 2) + 'px';
  if(!needle.classList.contains('ready')) requestAnimationFrame(()=> needle.classList.add('ready'));
}

function setWeekView(v){
  weekView = v;
  document.getElementById('seg').dataset.v = v;
  document.getElementById('vt-cards').classList.toggle('active', v==='cards');
  document.getElementById('vt-grid').classList.toggle('active', v==='grid');
  document.getElementById('cardsView').style.display = v==='cards' ? 'block' : 'none';
  document.getElementById('gridView').style.display = v==='grid' ? 'block' : 'none';
  if(v==='grid'){ requestAnimationFrame(positionGridNeedle); }
  else { scrollToCurrentRow(); }
}

/* ================= NOW / NEXT BOARD ================= */
/* "Next" always means the next real CLASS — never a break, lunch or free
   period. In a double period, Next skips the continuation and points at the
   following different session. Countdown and progress tick every second;
   the cards only rebuild (and animate in) when the state actually changes. */
function findNextClassAcrossWeek(fromMin, onlyCode){
  const now = new Date();
  if(fromMin == null) fromMin = currentMinutes();
  for(let offset=0; offset<8; offset++){
    const d = new Date(now);
    d.setDate(d.getDate()+offset);
    const dn = REAL_DAY_NAMES[d.getDay()];
    const sched = SCHEDULE[dn];
    if(!sched) continue;
    for(let idx=0; idx<PERIODS.length; idx++){
      const p = PERIODS[idx];
      if(p.type || !sched[idx]) continue;
      if(onlyCode && sched[idx] !== onlyCode) continue;
      if(offset===0 && toMin(p.start) < fromMin) continue;
      return {code:sched[idx], dayName:dn, idx, period:p, offsetDays:offset};
    }
  }
  return null;
}

function nowNextState(){
  const d = new Date();
  const nowMin = d.getHours()*60 + d.getMinutes();
  const nowSec = nowMin*60 + d.getSeconds();
  const tn = todayName();
  const sched = tn ? SCHEDULE[tn] : null;

  let now;
  if(!sched){
    now = {kind:'off', reason:'noday'};
  } else {
    const idx = PERIODS.findIndex(p => nowMin >= toMin(p.start) && nowMin < toMin(p.end));
    if(idx < 0){
      now = {kind:'off', reason: nowMin < toMin(PERIODS[0].start) ? 'before' : 'after'};
    } else if(PERIODS[idx].type){
      const p = PERIODS[idx];
      now = {kind:p.type, startMin:toMin(p.start), endMin:toMin(p.end)};
    } else {
      const b = classBlock(sched, idx);
      now = {kind: sched[idx] ? 'class' : 'free', code:sched[idx], startMin:b.startMin, endMin:b.endMin};
    }
  }

  const fromMin = now.kind === 'class' ? now.endMin : nowMin;
  const nx = findNextClassAcrossWeek(fromMin);
  let next = null;
  if(nx){
    const b = classBlock(SCHEDULE[nx.dayName], nx.idx);
    const target = new Date(d);
    target.setDate(target.getDate() + nx.offsetDays);
    target.setHours(Math.floor(b.startMin/60), b.startMin%60, 0, 0);
    next = {...nx, startMin:b.startMin, endMin:b.endMin, secsUntil:Math.max(0, Math.round((target - d)/1000))};
  }

  const key = [tn, now.kind, now.reason, now.startMin, nx && nx.dayName, nx && nx.idx, nx && nx.offsetDays].join('|');
  return {now, next, nowSec, key};
}

      <div class="tk-label"><span class="live-dot idle"></span>Now</div>

        <div class="tk-main dim">No class now</div>
        <div class="tk-name">${line}</div>
      </div>
    </div>`;
}

function nextColHTML(st){

      <div class="tk-label">Next class</div>
      <div class="tk-body"><div class="tk-main dim">—</div><div class="tk-name">No classes ahead</div></div>
    </div>`;
  }
  const c = COURSES[x.code];
  const dayLabel = x.offsetDays === 0 ? 'Today' : x.offsetDays === 1 ? 'Tomorrow' : x.dayName.slice(0,3);
  return `<div class="tk-col tk-next glow" style="--sc:${c.color}">
      <div class="tk-label"><span class="tk-arrow">▸</span>Next class<span class="tk-chip" data-nn="nextChip"></span></div>
      <button class="tk-body" onclick="openSheet('${x.code}')">
        <div class="tk-main">${x.code}</div>
        <div class="tk-name">${c.name}</div>
        <div class="tk-meta"><b>${dayLabel}</b> ${fmtMin(x.startMin)}–${fmtMin(x.endMin)}</div>
        <div class="tk-meta">${joinMeta(c.room, c.faculty) || '&nbsp;'}</div>
      </button>
    </div>`;
}

function tickNowNext(el, st){
  const n = st.now;
  if(n.startMin != null){
    const chip = el.querySelector('[data-nn="nowChip"]');
    if(chip) chip.textContent = fmtDur(n.endMin*60 - st.nowSec) + ' left';
    const bar = el.querySelector('[data-nn="prog"]');
    if(bar){
      const pct = (st.nowSec - n.startMin*60) / ((n.endMin - n.startMin)*60) * 100;
      bar.style.width = Math.min(100, Math.max(0, pct)).toFixed(2) + '%';
    }
  }
  if(st.next){
    const chip = el.querySelector('[data-nn="nextChip"]');
    if(chip) chip.textContent = 'in ' + fmtDur(st.next.secsUntil);
    const col = el.querySelector('.tk-next');
    if(col) col.classList.toggle('soon', st.next.secsUntil <= 15*60);
  }
}

let nnKey = null;
function renderNowNext(){
  const el = document.getElementById('nowNextBoard');
  if(!el) return;
  const st = nowNextState();
  if(st.key !== nnKey){
    const changed = nnKey !== null;
    nnKey = st.key;
    el.innerHTML = nowColHTML(st) + nextColHTML(st);
    // Let the bar paint at 0 first so it visibly fills in on a fresh state.
    requestAnimationFrame(() => requestAnimationFrame(() => tickNowNext(el, st)));
    // A class just started or ended: refresh the rest of the live UI too.
    if(changed){ renderGrid(); renderPeriodList(); renderTicker(); }
  } else {
    tickNowNext(el, st);
  }
}

/* ================= TICKER TAPE (today's lineup) ================= */
function renderTicker(){
  const track = document.getElementById('tickerTrack');
  const tn = todayName();
  const nowMin = currentMinutes();
  let items;
  if(!tn){
    items = [`<span class="tt-item">No classes today</span>`, `<span class="tt-item">Week resumes Monday</span>`];
  } else {
    let nextTagged = false;
    items = dayBlocks(tn).map(b=>{
      const state = b.endMin <= nowMin ? 'done' : b.startMin <= nowMin ? 'live' : 'up';
      let label = state==='done' ? 'DONE' : state==='live' ? 'LIVE' : '';
      if(state==='up' && !nextTagged){ label = 'NEXT'; nextTagged = true; }
      const room = COURSES[b.code].room;
      return `<span class="tt-item ${state}"><b>${b.code}</b>${fmtMin(b.startMin)}–${fmtMin(b.endMin)}${room && room!=='—' ? `<i>${room}</i>` : ''}${label?`<span class="st">${label}</span>`:''}</span>`;
    });
    if(!items.length) items = [`<span class="tt-item">No classes scheduled for ${tn}</span>`];
  }
  // Repeat short lineups so the loop never shows a gap.
  const reps = Math.max(1, Math.ceil(6 / items.length));
  let seq = [];
  for(let r=0; r<reps; r++) seq = seq.concat(items);
  const half = seq.join('<span class="tt-sep">◆</span>') + '<span class="tt-sep">◆</span>';
  track.innerHTML = half + half;
  // Constant reading speed regardless of how much is on the tape.
  requestAnimationFrame(()=>{
    const w = track.scrollWidth / 2;
    if(w > 0) track.style.animationDuration = Math.max(14, w / 38).toFixed(1) + 's';
  });
}

/* ================= MILESTONE STRIP ================= */
function nextMilestone(){
  const t = today0();
  const upcoming = KEYDATES.map(k=>({...k, d:new Date(k.date+"T00:00:00")})).filter(k=>k.d>=t).sort((a,b)=>a.d-b.d);
  return upcoming[0] || null;
}
function renderMilestoneChip(){
  const el = document.getElementById('milestoneChip');
  const m = nextMilestone();
  if(!m){ el.style.display='none'; return; }
  const diffDays = Math.round((m.d - today0()) / DAY_MS);
  const countTxt = diffDays===0 ? "Today" : diffDays===1 ? "Tomorrow" : diffDays+" days";
  el.innerHTML = `<div class="mc-date"><span class="m">${MONTHS_SHORT[m.d.getMonth()]}</span><span class="dd">${m.d.getDate()}</span></div>
    <div class="mc-body"><div class="k">Next key date · Sem ${m.sem}</div><div class="l">${m.label}</div></div>
    <span class="mc-count ${diffDays<=14?'hot':''}">${countTxt}</span>`;
}

/* ================= BOTTOM SHEET ================= */
function openSheet(code){
  const c = COURSES[code];
  if(!c) return;
  const sheet = document.getElementById('sheet');
  sheet.style.setProperty('--sc', c.color);
  const blocks = [];
  DAYS.forEach(d => dayBlocks(d, code).forEach(b => blocks.push({day:d, ...b})));
  const nx = findNextClassAcrossWeek(null, code);
  const nxBlockStart = nx ? classBlock(SCHEDULE[nx.dayName], nx.idx).s : null;
  const periods = sessionsPerWeek(code);

  const tiles = c.code ? `
    <div class="sh-tiles">
      <div class="sh-tile"><span>Faculty</span><b>${c.faculty || '—'}</b></div>
      <div class="sh-tile"><span>Room</span><b>${c.room || '—'}</b></div>
      <div class="sh-tile"><span>Credits</span><b>${c.credits}</b></div>
      <div class="sh-tile"><span>Per week</span><b>${periods ? periods+' period'+(periods===1?'':'s') : 'Not on grid'}</b></div>
    </div>` : `<div class="sh-note">Extracurricular activity. The timetable doesn't list a faculty member or room for this session.</div>`;

  const sessHTML = blocks.length ? blocks.map(b=>{
    const isNext = nx && nx.dayName===b.day && nxBlockStart===b.s;
    return `<div class="sh-sess ${isNext?'is-next':''}">
      <span class="dname">${DAY_ABBR[b.day]}</span>
      <span class="tm">${fmtMin(b.startMin)}–${fmtMin(b.endMin)}${b.periods>1?` · ${b.periods} periods`:''}</span>
      ${isNext?'<span class="tag next">NEXT</span>':''}
    </div>`;
  }).join('') : `<div class="sh-note">This course has no weekly class slot on the timetable.</div>`;

  document.getElementById('sheetContent').innerHTML = `
    <div class="sh-head">
      <span class="sh-dot"></span><span class="sh-code">${code}</span>${c.code?`<span class="sh-cc">${c.code}</span>`:''}
      <button class="sh-close" onclick="closeSheet()" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sh-name">${c.name}</div>
    ${tiles}
    <div class="sh-sub"><span>This week</span><span>${blocks.length} session${blocks.length===1?'':'s'}</span></div>
    ${sessHTML}`;
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('open'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* ================= TIMELINE TAB ================= */
function renderTimeline(){
  const now = new Date(), t0 = today0();
  let pct = ((now - TERM_START) / (TERM_END - TERM_START)) * 100;
  pct = Math.max(0, Math.min(100, pct));
  const w = semesterWeek();
  const daysToExams = Math.ceil((new Date("2026-11-23T00:00:00") - t0) / DAY_MS);
  const status = now < TERM_START ? "Semester hasn't started yet"
               : now > TERM_END ? "Semester III has concluded"
               : `Week ${w.n} of ${w.total} · ${daysToExams>0 ? daysToExams+' days to exams' : 'Exams underway'}`;
  const span = TERM_END - TERM_START;
  const ticks = KEYDATES.filter(k=>k.sem==='III').map(k=>{
    const d = new Date(k.date+"T00:00:00");
    const left = Math.max(0, Math.min(100, (d - TERM_START)/span*100));
    return `<span class="sem-tick ${d<=t0?'done':''}" style="left:${left}%" title="${k.label}"></span>`;
  }).join('');
  document.getElementById('semCard').innerHTML = `
    <div class="sem-top">
      <div><div class="t1">Semester III</div><div class="t2">${status}</div></div>
      <div class="pct">${Math.round(pct)}%</div>
    </div>
    <div class="sem-bar"><div class="sem-fill" id="semFill"></div>${ticks}</div>
    <div class="sem-ends"><span>20 Jul</span><span>23 Nov</span></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const f=document.getElementById('semFill'); if(f) f.style.width = pct+'%'; }));

  const nextM = nextMilestone();
  let html = '';
  ['III','IV'].forEach(sem=>{
    const list = KEYDATES.filter(k=>k.sem===sem);
    html += `<div class="tl-group">Semester ${sem} <span class="n">${list.length}</span></div><div class="tl">`;
    let todayPlaced = false;
    list.forEach(k=>{
      const d = new Date(k.date+"T00:00:00");
      const diff = Math.round((d - t0) / DAY_MS);
      if(!todayPlaced && diff >= 0){
        todayPlaced = true;
        if(list.some(x => new Date(x.date+"T00:00:00") < t0)){
          html += `<div class="tl-today">Today · ${REAL_DAY_NAMES[t0.getDay()].slice(0,3)} ${t0.getDate()} ${MONTHS_SHORT[t0.getMonth()]}</div>`;
        }
      }
      const isNext = nextM && nextM.date === k.date && nextM.label === k.label;
      const cls = diff < 0 ? 'done' : isNext ? 'next' : diff <= 14 ? 'soon' : 'up';
      const when = diff === 0 ? 'Today' : diff < 0 ? `${-diff} days ago` : diff === 1 ? 'Tomorrow' : `in ${diff} days`;
      html += `<div class="tl-item ${cls}">
        <span class="tl-node"></span>
        <div class="tl-date"><b>${d.getDate()}</b><span>${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}</span></div>
        <div class="tl-body"><div class="tl-label">${k.label}</div><div class="tl-when">${when}</div></div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('milestones').innerHTML = html;
}

/* ================= COURSES TAB ================= */
function sessionsPerWeek(code){
  let n = 0;
  DAYS.forEach(d=>{ SCHEDULE[d].forEach(v=>{ if(v===code) n++; }); });
  return n;
}
function sessionChips(code){
  const out = [];
  DAYS.forEach(d => dayBlocks(d, code).forEach(b => out.push(`${DAY_ABBR[d]} ${fmtMin(b.startMin)}–${fmtMin(b.endMin)}`)));
  return out;
}
function courseRowHTML(code, opts){
  opts = opts || {};
  const c = COURSES[code];
  if(!c) return '';
  const sess = sessionsPerWeek(code);
  const chips = opts.showSessions ? sessionChips(code) : [];
  return `<button class="course-row" style="--cc:${c.color}; background:color-mix(in srgb, ${c.color} 13%, var(--panel))" onclick="openSheet('${code}')">
    <div class="cr-main">
      <div class="cr-top">
        <span class="cr-code">${code}</span>
        <span class="cr-coursecode">${c.code||'No course code'}</span>
        ${sess>0 ? `<span class="cr-freq">${sess}×/wk</span>` : ''}
      </div>
      <div class="cr-name">${c.name}</div>
      <div class="cr-meta">${c.faculty || 'No faculty listed'} · ${c.room && c.room!=='—' ? c.room : 'No room listed'}</div>
      ${sess===0 ? `<span class="cr-flag">Not on the weekly grid</span>` : ''}
      ${chips.length ? `<div class="cr-sessions">${chips.map(s=>`<span>${s}</span>`).join('')}</div>` : ''}
    </div>
    <div class="cr-credits"><span class="n">${c.credits}</span><span class="lbl">CR</span></div>
  </button>`;
}
function renderCourses(){
  const totalCredits = COURSE_ORDER.reduce((sum, code) => sum + (COURSES[code].credits || 0), 0);
  const totalSessions = COURSE_ORDER.reduce((sum, code) => sum + sessionsPerWeek(code), 0);
  const weeklyHours = (totalSessions * 55 / 60);
  const credited = COURSE_ORDER.filter(code => COURSES[code].credits > 0);
  document.getElementById('loadCard').innerHTML = `
    <div class="load-top">
      <div class="big">${totalCredits}<small>credits</small></div>
      <div class="side"><b>${COURSE_ORDER.length}</b> courses<br>~<b>${weeklyHours.toFixed(0)}</b> class hrs a week</div>
    </div>
    <div class="load-bar">${credited.map((code,i)=>`<i style="flex:${COURSES[code].credits}; background:${COURSES[code].color}; animation-delay:${i*45}ms" title="${code}: ${COURSES[code].credits} credits"></i>`).join('')}</div>
    <div class="load-keys">${credited.map(code=>`<span><i style="background:${COURSES[code].color}"></i>${code} <em>${COURSES[code].credits}</em></span>`).join('')}</div>`;

  const input = document.getElementById('courseSearchInput');
  const q = (input.value || '').trim().toLowerCase();
  document.getElementById('searchClear').classList.toggle('show', !!input.value);
  const matches = COURSE_ORDER.filter(code=>{
    if(!q) return true;
    const c = COURSES[code];
    return code.toLowerCase().includes(q) ||
      (c.code||'').toLowerCase().includes(q) ||
      c.name.toLowerCase().includes(q) ||
      (c.faculty||'').toLowerCase().includes(q) ||
      (c.room||'').toLowerCase().includes(q);
  });

  document.getElementById('courseCount').textContent = q ? `${matches.length} of ${COURSE_ORDER.length}` : COURSE_ORDER.length;
  const listEl = document.getElementById('courseListWrap');
  listEl.innerHTML = matches.length
    ? `<div class="course-table">${matches.map(code => courseRowHTML(code, {showSessions:true})).join('')}</div>`
    : `<div class="lookup-empty">No course matches “${input.value.trim()}”.<br>Try a course code, faculty name or room.</div>`;
}
function clearSearch(){
  const input = document.getElementById('courseSearchInput');
  input.value = ''; renderCourses(); input.focus();
}

/* ================= TABS / THEME ================= */
function switchTab(t){
  ['week','courses','timeline'].forEach(x=>{
    document.getElementById('nav-'+x).classList.toggle('active', x===t);
    document.getElementById('view-'+x).style.display = x===t ? 'block' : 'none';
  });
  window.scrollTo({top:0, behavior:'auto'});
  if(t==='courses') renderCourses();
  if(t==='timeline') renderTimeline();
  if(t==='week'){ scrollToCurrentRow(); requestAnimationFrame(positionGridNeedle); }
}
function syncThemeColor(){
  const panel = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();
  document.getElementById('themeColorMeta').setAttribute('content', panel || '#12161C');
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='light' ? 'dark' : 'light');
  syncThemeColor();
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
